# NoLimits: release candidate for EXISTING Worker, NOT A GO-LIVE COMMAND.
# Deploy ONLY after user+Isen approve Phase 3 and existing version is archived.
# Production Worker name is NOT the historical value in wrangler.toml.
name = "nolimits-booking-test"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://localboostzs.github.io"
NL_PUBLIC_SITE_BASE = "https://localboostzs.github.io/nolimits"
# Alias bookings ON: Cal.com receives an opaque alias, so its standard mails and its own
# cancel/reschedule links never reach customers. If an alias cannot be stored, the
# booking is refused (HTTP 503) instead of passing the real address to Cal.com.
NL_ALIAS_MODE = "enabled"
NL_ALIAS_DOMAIN = "localboost-zs.ch"
NL_ALIAS_PREFIX = "info"
NL_ALIAS_SEPARATOR = "+"
NL_ICS_ENABLED = "false"

# GO-LIVE CHECKLIST (never silently activate):
# - After authorised new site activation, set NL_PUBLIC_SITE_BASE to
#   "https://nolimits-barber.ch" (or the confirmed canonical www hostname).
# - Add the confirmed live site origin to ALLOWED_ORIGINS.
# - Retain all ten existing approved NoLimits eventTypeIds if the existing
#   Cal.com account is retained; verify Isen's destination/conflict calendar.
# - Keep the separate LAB event isolated. Do not expose its ID in SERVICES.
# - Verify existing secret NAMES remain present after Wrangler deployment.
# - Add NL_SUPABASE_SECRET_KEY server-side; protect natively with Supabase RLS.
# - Before deploying: alias table reachable in Supabase, mail to info+...@localboost-zs.ch
#   arrives, and no open booking still carries a real customer address.
# - Keep NL_ICS_ENABLED="false": manual Google Calendar imports
#   created duplicate appointments and did not reliably update/cancel.
# - Never copy API credentials or customer exports into this file.

# Keep the two current Cloudflare rate-limit bindings.
[[unsafe.bindings]]
name = "RL_BOOK"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[unsafe.bindings]]
name = "RL_SLOTS"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 60, period = 60 }
