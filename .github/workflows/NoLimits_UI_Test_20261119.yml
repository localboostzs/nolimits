name: NoLimits mobile/desktop read-only UI audit
on:
  push:
    branches:
      - feature/NoLimits_Aliasbuchung_20261119
    paths:
      - 'tests/NoLimits_MobileDesktop_UI_20261119.mjs'
      - 'assets/css/**'
      - 'verwaltung/**'
      - 'booking-test/**'
      - 'konto/**'
      - 'termin-verwalten/**'
      - '.github/workflows/NoLimits_UI_Test_20261119.yml'
  workflow_dispatch:
jobs:
  browser-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Playwright browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve the exact feature branch locally (never change production)
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/nolimits-ui-preview.log 2>&1 &
          sleep 2
          curl --fail --silent http://127.0.0.1:8765/booking-test/ -o /dev/null
      - name: Read-only mobile and desktop UI audit
        env:
          NOLIMITS_UI_BASE: http://127.0.0.1:8765
        run: node tests/NoLimits_MobileDesktop_UI_20261119.mjs
      - name: Save screenshots of public demo pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NoLimits_UI_Audit_20261119
          path: artifacts/nolimits-ui-20261119/
          if-no-files-found: ignore
          retention-days: 7
