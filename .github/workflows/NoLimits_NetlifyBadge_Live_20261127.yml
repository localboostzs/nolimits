name: NoLimits – Hosting-Branding Wächter (nur lesend)
# Schlägt fehl, sobald auf Netlify oder Cloudflare Pages ein Hosting-Badge sichtbar wird oder die
# Sicherheitsregel (CSP) fehlt. GitHub meldet den fehlgeschlagenen Lauf per E-Mail.
# Nach dem Domainwechsel zusätzlich die Domain eintragen (Variable NOLIMITS_BADGE_SITES).
on:
  schedule:
    # Zweimal täglich, UTC; GitHub kann geplante Läufe verzögern.
    - cron: "47 5,17 * * *"
  workflow_dispatch:
concurrency:
  group: nolimits-badge-watch
  cancel-in-progress: false
jobs:
  branding:
    name: Kein sichtbares Hosting-Branding
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright with preinstalled Chrome when available
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "PLAYWRIGHT_EXECUTABLE_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Live-Seiten ansehen (nur lesen, nichts absenden)
        env:
          NOLIMITS_BADGE_SITES: ${{ vars.NOLIMITS_BADGE_SITES }}
        run: node tests/live/NoLimits_NetlifyBadge_Live_20261127.mjs
      - name: Bilder bei Fehler sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NoLimits_Hosting_Branding
          path: artifacts/netlify-badge/
          if-no-files-found: ignore
          retention-days: 14
